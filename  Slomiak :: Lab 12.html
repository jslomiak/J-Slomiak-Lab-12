<!doctype html>

<head>
<meta charset="utf-8">
<title>Lab 12 Slomiak</title>
<style>

body {

font-family: sans-serif;
font-size: 15px;
font-weight: bold;
color: white;

background: linear-gradient(135deg, rgb(11, 11, 132), rgb(73, 5, 73), rgb(118, 5, 5), rgb(73, 5, 73), rgb(11, 11, 132));
background-size: 400% 400%;

animation: gradient 15s ease infinite;
height: 100vh;
}

@keyframes gradient {
  0% {
    background-position: 0% 50%;
  }
  50% {
    background-position: 100% 50%;
  }
  100% {
    background-position: 0% 50%;
  }
}

button {
  background-color: white;
  border: none;
  color:black ;
  padding: 15px 32px;
  font-family: sans-serif;
  font-weight: bold;
  text-align: center;
  font-size: 12px;
  margin: 4px 2px;
}

</style> 

    </head>
        <body>


<button id="trig" type="button">Play note</button>

<p>
Delay time <input id="time" type="range" min="10" max="2000" step="10" value="350">
<br>
<br>
Feedback <input id="fb" type="range" min="0" max="95" step="1" value="50">
<br>
<p>
Mod Speed (Hz) <input id="mod" type="range" min="1" max="500" step="1" value="10">
</p>

<script>    

const ctx = new AudioContext();

const master = new GainNode(ctx)
master.gain.value = 0.5;

const delay = new DelayNode(ctx)
delay.delayTime.value = 0.35

const feedback = new GainNode(ctx, { gain: 0.5 });

const hpfilter = new BiquadFilterNode(ctx, { type: 'highpass', frequency: 1000 });

let modRateAmount = 1;

// let activeFilterLFO = null;

delay.connect(feedback);
feedback.connect(delay);    

delay.connect(hpfilter);
hpfilter.connect(master);
master.connect(ctx.destination);

const midiPitches = [40, 42, 44, 45, 47, 49, 50, 52]; // e mixolydian scale

        // 2. Create the random picker function
        const randomPitch = function() {
            let randomMidiNote = midiPitches[Math.floor(Math.random() * midiPitches.length)];
            
            let newFreq = 440 * 2 ** ((randomMidiNote - 69) / 12);

            return newFreq;
        }

        const MultArray = [20, 40, 80, 160, 320]
        const filterFreq = function()
            {
                let filterMult = MultArray[Math.floor(Math.random() * MultArray.length)];
              

                return filterMult
                        }

document.getElementById('trig').addEventListener('click', function () {

  ctx.resume();

  const t = ctx.currentTime;

  const osc = new OscillatorNode(ctx, { type: 'sawtooth', frequency: randomPitch() });

  const filterLFO = new OscillatorNode(ctx);
  filterLFO.type = "sine";
  filterLFO.frequency.value = modRateAmount; 

  const LFOdepth = new GainNode(ctx);
  LFOdepth.gain.value = 500;

  filterLFO.connect(LFOdepth);
  LFOdepth.connect(hpfilter.frequency);

  const adsr = new GainNode(ctx, { gain: 0 });

  adsr.gain.setValueAtTime(0, t);
  adsr.gain.linearRampToValueAtTime(0.2, t + 0.01);
  adsr.gain.linearRampToValueAtTime(0.2, t);
  adsr.gain.linearRampToValueAtTime(0.1, t + 0.1);
  adsr.gain.setValueAtTime(0, t + 0.1);

  osc.connect(adsr);
  adsr.connect(delay);
  adsr.connect(master);

  osc.start(t);
  filterLFO.start(t);
  osc.stop(t + 0.9);
  filterLFO.stop(t + 0.9);
});

document.getElementById('time').addEventListener('input', function (e) {
  delay.delayTime.value = e.target.value / 1000;
});
document.getElementById('fb').addEventListener('input', function (e) {
  feedback.gain.value = e.target.value / 100;
});
document.getElementById('mod').addEventListener('input', function (e) {
  modRateAmount = e.target.value / 10;
});
</script>

</body>
</html>
